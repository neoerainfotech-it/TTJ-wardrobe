name: flutter_application_1
description: "A Constitution/KYC Flutter project with JSON Localization."
publish_to: 'none'
version: 1.0.22+22

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2
  file_picker: ^10.3.10
  flutter_local_notifications: ^21.0.0
  timezone: ^0.10.0
  workmanager: ^0.9.0+3
  permission_handler: ^12.0.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  mobile_scanner: ^7.1.4
  shared_preferences: ^2.3.2
  google_mlkit_text_recognition: ^0.15.0
  pdf_render_maintained: ^1.6.1

  # Combined Network, Launch & Info section
  url_launcher: ^6.3.1
  http: ^1.2.2
  package_info_plus: ^8.0.0  # Make sure this is only here once!

  provider: ^6.1.1
  razorpay_flutter: ^1.4.0
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^3.4.1
  fluttertoast: ^9.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

dependency_overrides:
  timezone: ^0.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/ttj_logo.jpeg
    - assets/icon.jpeg
    - assets/banner1.webp
    - assets/banner2.jpg
    - assets/gold_coin.jpeg
    - assets/silver_coin.jpeg
    - shorebird.yaml

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.jpeg"
  remove_alpha_ios: true

